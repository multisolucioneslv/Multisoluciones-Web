# Include from nginx.conf inside the http {} context.
# Empty keys are deliberately ignored so normal page/static traffic is untouched.
map "$request_method:$uri" $multisoluciones_contact_limit_key {
    default "";
    ~^POST:/(?:$|(?:es|ko|pt)/?$|(?:es|ko|pt)/contact-preference/[^/]+/?$|contact-preference/[^/]+/?$) $binary_remote_addr;
}

limit_req_zone $multisoluciones_contact_limit_key zone=multisoluciones_contact:10m rate=1r/m;
