server {
    server_name multisoluciones.online www.multisoluciones.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    if ($host = www.multisoluciones.online) {
        return 301 https://multisoluciones.online$request_uri;
    }

    limit_req zone=multisoluciones_contact burst=2 nodelay;
    limit_req_status 429;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/multisoluciones.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/multisoluciones.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/security-headers.conf;
}

server {
    if ($host = www.multisoluciones.online) {
        return 301 https://multisoluciones.online$request_uri;
    }
    if ($host = multisoluciones.online) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name multisoluciones.online www.multisoluciones.online;
    return 404;
}
